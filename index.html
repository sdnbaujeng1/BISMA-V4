<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SDN BAUJENG I BEJI</title>
    <meta name="description" content="Sistem Informasi Manajemen Sekolah Terpadu SDN Baujeng 1" />

    <script>
      (function() {
        function makeSafeStorage() {
          var store = {};
          return {
            getItem: function(key) {
              return Object.prototype.hasOwnProperty.call(store, key) ? store[key] : null;
            },
            setItem: function(key, val) {
              store[key] = String(val);
            },
            removeItem: function(key) {
              delete store[key];
            },
            clear: function() {
              store = {};
            },
            key: function(i) {
              return Object.keys(store)[i] || null;
            },
            get length() {
              return Object.keys(store).length;
            }
          };
        }

        var localWorks = false;
        try {
          var testL = '__t_' + Math.random();
          window.localStorage.setItem(testL, '1');
          window.localStorage.removeItem(testL);
          localWorks = true;
        } catch (e) {
          localWorks = false;
        }

        if (!localWorks) {
          var safeLocal = makeSafeStorage();
          try {
            Object.defineProperty(window, 'localStorage', {
              get: function() { return safeLocal; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {}
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'localStorage', {
                get: function() { return safeLocal; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        var sessionWorks = false;
        try {
          var testS = '__s_' + Math.random();
          window.sessionStorage.setItem(testS, '1');
          window.sessionStorage.removeItem(testS);
          sessionWorks = true;
        } catch (e) {
          sessionWorks = false;
        }

        if (!sessionWorks) {
          var safeSession = makeSafeStorage();
          try {
            Object.defineProperty(window, 'sessionStorage', {
              get: function() { return safeSession; },
              configurable: true,
              enumerable: true
            });
          } catch (e1) {}
          try {
            if (window.Window && window.Window.prototype) {
              Object.defineProperty(window.Window.prototype, 'sessionStorage', {
                get: function() { return safeSession; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
